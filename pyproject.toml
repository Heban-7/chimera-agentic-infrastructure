[project]
name = "chimera-agentic-infrastructure"
version = "0.1.0"
description = "Spec-Driven Infrastructure for Autonomous Influencer Agents — Project Chimera"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AiQEM", email = "engineering@aiqem.tech" }]

dependencies = [
    "pydantic>=2.0",
    "pydantic-ai",
    "weaviate-client>=4.0",
    "coinbase-agentkit",
    "redis>=5.0",
    "asyncpg",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
