# =============================================================================
# Project Chimera — CI/CD Pipeline
# Ref: ProjectChimeraTheAgenticInfrastructureChallenge.md (Task 3.3)
#
# Runs on every push and pull request:
#   1. Lint with ruff
#   2. Run test suite (TDD — failing tests are expected pre-implementation)
#   3. Spec-drift detection
#   4. Docker build verification
# =============================================================================

name: Project Chimera CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install ruff mypy pydantic

      - name: Run ruff linter
        run: |
          source .venv/bin/activate
          ruff check src/ tests/ --output-format=github

  # ---------------------------------------------------------------------------
  # Job 2: Test Suite (TDD)
  # ---------------------------------------------------------------------------
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pydantic pydantic-ai redis pytest pytest-asyncio pytest-cov httpx

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short --color=yes --cov=src --cov-report=term-missing
        continue-on-error: true # TDD: Tests may fail pre-implementation

      - name: Report test results
        if: always()
        run: echo "Test execution complete. Failing tests are expected in TDD mode."

  # ---------------------------------------------------------------------------
  # Job 3: Spec-Drift Detection
  # ---------------------------------------------------------------------------
  spec-check:
    name: Spec Alignment Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run spec-drift detector
        run: |
          python -c "
          import pathlib, re, sys
          spec_ids = set()
          for sf in pathlib.Path('specs').glob('*.md'):
              content = sf.read_text(encoding='utf-8')
              spec_ids.update(re.findall(r'(?:FR|NFR|MA|AI|UI)\s*[\d.]+', content))
          print(f'Found {len(spec_ids)} spec requirements')
          src_files = list(pathlib.Path('src').rglob('*.py'))
          traced = set()
          for pf in src_files:
              content = pf.read_text(encoding='utf-8')
              refs = re.findall(r'(?:FR|NFR|MA|AI|UI)\s*[\d.]+', content)
              traced.update(refs)
          covered = spec_ids & traced
          uncovered = spec_ids - traced
          print(f'Spec coverage: {len(covered)}/{len(spec_ids)} requirements traced')
          if uncovered:
              print(f'Uncovered: {sorted(uncovered)}')
          "
        continue-on-error: true # Informational — not blocking

  # ---------------------------------------------------------------------------
  # Job 4: Docker Build Verification
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chimera-agentic-infrastructure:ci .
        continue-on-error: true # May fail if deps need network access
